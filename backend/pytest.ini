; =============================================================================
; Ledger de Certificados — pytest configuration.
; =============================================================================
[pytest]
DJANGO_SETTINGS_MODULE = config.settings.dev
python_files = test_*.py tests.py *_test.py
python_classes = Test*
python_functions = test_*
testpaths = apps
addopts =
    --strict-markers
    --reuse-db
    --cov=apps
    --cov-report=term-missing
filterwarnings =
    ignore::DeprecationWarning
