# Ledger de Certificados de Conformidad — prueba técnica (stack local).
# Topología dockerizada, standalone. 4 contenedores:
#   db (PostgreSQL 17), api (Django + Gunicorn),
#   web (SPA React/Vite servida por nginx-unprivileged), proxy (Caddy, TLS interno).
#
# Solo el proxy expone puertos al host. db/api/web viven en la red interna
# 'ledger' y NO publican puertos.

name: ledger

services:
  db:
    image: postgres:17
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      TZ: ${TZ}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - ledger
    # Sin 'ports:' a propósito — la base de datos solo es accesible
    # dentro de la red interna 'ledger'.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: ./backend
      # Entorno dev/demo: incluye el tooling de test para pytest. La imagen de
      # producción se construye sin este arg (INSTALL_DEV=false por defecto).
      args:
        INSTALL_DEV: "true"
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST: ${POSTGRES_HOST}
      POSTGRES_PORT: ${POSTGRES_PORT}
      # Dev local por defecto; prod debe exportar DJANGO_SETTINGS_MODULE.
      DJANGO_SETTINGS_MODULE: ${DJANGO_SETTINGS_MODULE:-config.settings.dev}
      DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY}
      DJANGO_DEBUG: ${DJANGO_DEBUG}
      DJANGO_ALLOWED_HOSTS: ${DJANGO_ALLOWED_HOSTS}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS}
      CSRF_TRUSTED_ORIGINS: ${CSRF_TRUSTED_ORIGINS}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      TZ: ${TZ}
    networks:
      - ledger
    # Gunicorn escucha en 8000 solo dentro de la red interna (Caddy lo enruta).
    expose:
      - "8000"

  web:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL}
    restart: unless-stopped
    depends_on:
      - api
    networks:
      - ledger
    # nginx-unprivileged sirve la SPA en 8080 (no-root) solo en la red interna.
    expose:
      - "8080"

  proxy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      - web
      - api
    # En Windows/macOS el puerto 80 del host suele estar ocupado; por eso se
    # publican puertos altos → Caddy sigue escuchando 80/443 DENTRO del
    # contenedor. Acceso dev: https://localhost:8443
    ports:
      - "8080:80"
      - "8443:443"
    volumes:
      - ./proxy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - ledger

networks:
  ledger:
    driver: bridge

volumes:
  pgdata:
  caddy_data:
  caddy_config:
